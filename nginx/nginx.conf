log_format upstream_debug
    'client=$remote_addr '
    'status=$status '
    'upstream=$upstream_addr '
    'upstream_time=$upstream_response_time';

server {
	listen 80;

	access_log /var/log/nginx/access.log upstream_debug;

	location /hello {
		return 200 "hello";
	}
	location /api/ {
		proxy_pass http://backend:8000/;
	}
}
