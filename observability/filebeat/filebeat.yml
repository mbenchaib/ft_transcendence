filebeat.inputs:
  - type: filestream
    id: crm-docker-logs
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*-json.log

    parsers:
      - container:
          format: docker

    prospector.scanner.symlinks: false

output.logstash:
  hosts: [logstash:5044]

logging.level: info
