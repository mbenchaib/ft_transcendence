input {
  stdin {
    codec => line
  }
}

filter {
  if [message] =~ /^client=/ {
    mutate {
      add_field => {
        "service" => "nginx"
      }
    }

    dissect {
      mapping => {
        "message" => "client=%{client_ip} status=%{http_status} upstream=%{upstream_address} upstream_time=%{upstream_time_seconds}"
      }
      tag_on_failure => ["_nginx_parse_failure"]
    }

    if "_nginx_parse_failure" not in [tags] {
      mutate {
        convert => {
          "http_status" => "integer"
        }
      }

      if [upstream_address] == "-" {
        mutate {
          remove_field => ["upstream_address"]
        }
      }

      if [upstream_time_seconds] == "-" {
        mutate {
          remove_field => ["upstream_time_seconds"]
        }
      } else if [upstream_time_seconds] =~ /^\d+(\.\d+)?$/ {
        mutate {
          convert => {
            "upstream_time_seconds" => "float"
          }
        }
      } else {
        mutate {
          add_tag => ["_invalid_upstream_time"]
        }
      }
    }
  }
}

output {
  stdout {
    codec => rubydebug
  }
}

