input {
  beats {
    port => 5044

    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/tls/logstash.crt"
    ssl_key => "/usr/share/logstash/config/tls/logstash.pkcs8.key"

    ssl_client_authentication => "none"
  }
}
filter {
  if [log][file][path] =~ /^\/logs\/nginx\/[^\/]+-json\.log$/ {
      mutate {
        replace => { "[service][name]" => "nginx" }
      }
    }
    else if [log][file][path] =~ /^\/logs\/backend\/[^\/]+-json\.log$/ {
      mutate {
        replace => { "[service][name]" => "backend" }
      }
    }
    else {
      mutate {
        add_tag => ["_unknown_log_source"]
      }
    }

  if [message] =~ /^client=/ {
    dissect {
      mapping => {
        "message" => "client=%{client_ip} status=%{http_status} upstream=%{upstream_address} upstream_time=%{upstream_time_seconds}"
      }
      tag_on_failure => ["_nginx_parse_failure"]
    }

    if "_nginx_parse_failure" not in [tags] {
      mutate {
        convert => {
          "http_status" => "integer"
        }
      }

      if [upstream_address] == "-" {
        mutate {
          remove_field => ["upstream_address"]
        }
      }

      if [upstream_time_seconds] == "-" {
        mutate {
          remove_field => ["upstream_time_seconds"]
        }
      } else if [upstream_time_seconds] =~ /^\d+(\.\d+)?$/ {
        mutate {
          convert => {
            "upstream_time_seconds" => "float"
          }
        }
      } else {
        mutate {
          add_tag => ["_invalid_upstream_time"]
        }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://es01:9200"]

    user => "logstash_crm"
    password => "${LOGSTASH_WRITER_PASSWORD}"

    ssl_enabled => true
    ssl_certificate_authorities => [
      "/usr/share/logstash/config/certs/ca.crt"
    ]

    index => "crm-logs-v2-%{+YYYY.MM.dd}"
    action => "create"

    manage_template => false
    ilm_enabled => false
    data_stream => false
  }
}
