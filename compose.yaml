
services:
  nginx:
    image: nginx:alpine
    networks:
      - frontend_net
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # Resource limits
    mem_limit: 128m
    cpus: 0.25
    # Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Filesystem security
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    # Linux capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    # Prevent gaining new privileges
    security_opt:
      - no-new-privileges:true
  backend:
    image: python:3.12-alpine
    networks:
      - frontend_net
      - backend_net
    # Run as non-root
    user: "10001:10001"
    expose:
      - "8000"
    working_dir: /app
    volumes:
      - ./backend/public/:/app/:ro
    command:
      - python3
      - -m
      - http.server
      - "8000"
      - --bind
      - 0.0.0.0
    # Backend health check
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: on-failure
    # Resource limits
    mem_limit: 256m
    cpus: 0.50
    # Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    # Filesystem security
    read_only: true
    tmpfs:
      - /tmp
    # Remove Linux capabilities
    cap_drop:
      - ALL
    # Prevent gaining new privileges
    security_opt:
      - no-new-privileges:true
networks:
  frontend_net:
    driver: bridge

  backend_net:
    driver: bridge
