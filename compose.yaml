services:
  nginx:
    image: nginx:alpine
    ports: 
      - 8080:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backend:
    image: python:3.12-alpine
    expose:
      - 8000
    working_dir: /app
    volumes:
      - ./backend/public/:/app/:ro
    command: ["python3","-m", "http.server", "8000", "--bind" ,"0.0.0.0"]
    healthcheck:
      test: ["CMD", "python3", "-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period:  5s
    restart: on-failure

